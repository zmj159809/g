name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate tag and prepare version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          # Older tags may still declare the version as a constant.
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('build/build.go')
          source = path.read_text()
          source = re.sub(r'const\s*\((\s*// ShortVersion[^\n]*\n\s*ShortVersion\s*=)', r'var (\1', source, count=1)
          path.write_text(source)
          PY
      - name: Test
        run: go test -gcflags=all=-l ./...
      - name: Build archives and checksums
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          flags="-s -w -X github.com/voidint/g/build.ShortVersion=$RELEASE_VERSION -X github.com/voidint/g/build.GitCommit=$(git rev-parse --short HEAD)"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            if grep -q 'UpdateRepo' build/build.go; then
              flags+=" -X github.com/voidint/g/build.UpdateRepo=$GITHUB_REPOSITORY"
            fi
          fi
          for target in darwin/amd64 darwin/arm64 linux/386 linux/amd64 linux/arm linux/arm64 linux/s390x linux/riscv64 windows/386 windows/amd64 windows/arm64 freebsd/386 freebsd/amd64 freebsd/arm freebsd/arm64; do
            os=${target%/*}
            arch=${target#*/}
            binary=g
            [[ "$os" != windows ]] || binary=g.exe
            stage=$(mktemp -d)
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$flags" -o "$stage/$binary" .
            asset="g$RELEASE_VERSION.$os-$arch"
            if [[ "$os" == windows ]]; then
              (cd "$stage" && zip -q "$GITHUB_WORKSPACE/dist/$asset.zip" "$binary")
            else
              tar -czf "dist/$asset.tar.gz" -C "$stage" "$binary"
            fi
            rm -rf "$stage"
          done
          (cd dist && sha256sum *.tar.gz *.zip > sha256sum.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite assets."
            exit 1
          fi
          options=(--verify-tag --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" dist/* "${options[@]}"
